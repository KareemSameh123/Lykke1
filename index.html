<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYKKE | Est. 2026 • Egypt</title>
    
    <style>
        :root {
            --bg-color: #F6F5F0;      
            --text-color: #1A1A1A;    
            --accent-color: #7B1113;  
            --card-bg: #FFFFFF;        
            --font-main: 'Helvetica Neue', Arial, sans-serif;
        }

        body { margin: 0; font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        a { text-decoration: none; color: var(--text-color); }
        
        header { padding: 25px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--text-color); }
        .brand-container { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-text { font-size: 32px; font-weight: 500; letter-spacing: 8px; text-transform: uppercase; margin-bottom: 2px; }
        .logo-subtext { font-size: 10px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #555; }

        .nav-links a { margin-left: 40px; font-weight: bold; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent-color); }

        .hero { height: 75vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 5rem; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -1px; line-height: 1; }
        .hero p { font-size: 1.1rem; max-width: 500px; margin: 30px 0 40px; letter-spacing: 0.5px; font-weight: 300; }
        
        .btn { padding: 16px 45px; background-color: var(--text-color); color: var(--bg-color); text-transform: uppercase; font-size: 12px; font-weight: bold; letter-spacing: 2px; transition: background-color 0.3s; border: 1px solid var(--text-color); cursor: pointer; }
        .btn:hover { background-color: transparent; color: var(--text-color); }

        .section-title { text-align: center; font-size: 2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin: 100px 0 50px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 0 50px 100px; max-width: 1200px; margin: 0 auto; }
        .product-card { text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .product-image { width: 100%; aspect-ratio: 3/4; background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; border: 1px solid #E2E1DA; overflow: hidden; transition: transform 0.5s ease; cursor: pointer; }
        .product-card:hover .product-image { transform: scale(0.99); }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .product-price { color: #555; font-size: 0.95rem; margin-bottom: 15px; }

        /* --- NEW GREEN WHATSAPP BUTTON --- */
        .wa-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background-color: #25D366; 
            color: white;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            width: 85%;
            margin-top: 5px;
        }
        .wa-btn:hover {
            background-color: #128C7E; 
            transform: translateY(-2px);
        }

        footer { background-color: var(--text-color); color: var(--bg-color); text-align: center; padding: 80px 20px; }
        footer .footer-logo { font-size: 24px; letter-spacing: 6px; margin-bottom: 20px; display: block; }
        footer a { color: var(--bg-color); margin: 0 20px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        
        img { -webkit-user-drag: none; user-drag: none; }
        .loading { text-align: center; font-size: 1.2rem; letter-spacing: 2px; grid-column: 1/-1; opacity: 0.5; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-text">LYKKE</div>
            <div class="logo-subtext">Est. 2026 &bull; Egypt</div>
        </div>
        <div class="nav-links">
            <a href="#collection">Collection 01</a>
            <a href="#about">The Brand</a>
        </div>
    </header>

    <section class="hero">
        <h1>Modern<br>Heritage.</h1>
        <p>A meticulous blend of vintage aesthetics and bold streetwear graphics. Designed and crafted in Egypt.</p>
        <a href="#collection" class="btn">View the Drop</a>
    </section>

    <h2 class="section-title" id="collection">Initial Drop</h2>
    
    <section class="product-grid" id="product-container">
        <div class="loading">Loading Collection...</div>
    </section>

    <footer id="about">
        <span class="footer-logo">LYKKE</span>
        <div style="margin-bottom: 40px;">
            <a href="https://instagram.com/yourhandle" target="_blank">Instagram</a>
        </div>
        <p style="font-size: 0.75rem; opacity: 0.5; letter-spacing: 1px; text-transform: uppercase;">&copy; 2026 LYKKE. All rights reserved.</p>
    </footer>

    <script>
        // Your permanent WhatsApp Number
        const WHATSAPP_NUMBER = "201006440815"; 

        async function fetchProducts() {
            try {
                // Fetching data locally from your CMS JSON file
                const response = await fetch('products.json');
                const data = await response.json();
                const container = document.getElementById('product-container');
                container.innerHTML = ''; 

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = '<div class="loading">Store is currently updating.</div>';
                    return;
                }

                data.items.forEach(product => {
                    // Create the auto-fill message
                    const message = encodeURIComponent(`Hi LYKKE, I would like to order the "${product.title}" for ${product.price}.`);
                    const waLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

                    const productCard = `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${product.image}" alt="${product.title}">
                            </div>
                            <div class="product-title">${product.title}</div>
                            <div class="product-price">${product.price}</div>
                            <a href="${waLink}" target="_blank" class="wa-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.888-.788-1.487-1.761-1.66-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                                </svg>
                                Order via WhatsApp
                            </a>
                        </div>
                    `;
                    container.innerHTML += productCard;
                });
            } catch (error) {
                console.error("Error loading products");
            }
        }

        fetchProducts();
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
